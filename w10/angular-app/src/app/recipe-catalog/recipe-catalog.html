<section class="recipe-catalog">
  <header>
    <h1>Recept Katalógus</h1>
    <nav class="header-actions" aria-label="Modul akciók" *ngIf="auth.isLoggedIn()">
      <button class="action-btn" (click)="openEditor()">Új recept hozzáadása</button>
      <button class="action-btn">Kategóriák</button>
    </nav>
  </header>

  <section aria-label="Keresés és szűrés">
    <app-search-bar></app-search-bar>
  </section>

  <section aria-label="Recept lista">
    <ng-container *ngIf="recipeService.loading(); else notLoading">
      <div class="recipe-grid" aria-busy="true">
        <app-skeleton-card *ngFor="let n of [1,2,3,4,5,6]"></app-skeleton-card>
      </div>
    </ng-container>
    <ng-template #notLoading>
      <ng-container *ngIf="recipeService.error(); else noError">
        <div class="error-panel" role="status">
          <p>Hiba történt a receptek betöltésekor: {{ recipeService.error() }}</p>
          <button class="action-btn" (click)="recipeService.loadRecipes()">Újrapróbálás</button>
        </div>
      </ng-container>
      <ng-template #noError>
        <ng-container *ngIf="filteredRecipes.length > 0; else empty">
          <app-recipe-list [recipes]="filteredRecipes" (edit)="openEditor($event)"></app-recipe-list>
        </ng-container>
        <ng-template #empty>
          <app-empty-state></app-empty-state>
        </ng-template>
      </ng-template>
    </ng-template>
  </section>
</section>

<!-- Modal dialógus overlay a body végén -->
<ng-container *ngIf="showEditor">
  <div class="dialog-backdrop" (click)="closeEditor()"></div>
  <div class="dialog" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1001;">
    <app-recipe-editor [initialRecipe]="editingRecipe" (close)="closeEditor()" (save)="onEditorSave($event)"></app-recipe-editor>
    <button class="dialog-close" (click)="closeEditor()">×</button>
  </div>
</ng-container>
