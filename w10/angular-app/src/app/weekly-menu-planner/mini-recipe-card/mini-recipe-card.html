<div class="mini-recipe" tabindex="0" role="group" aria-label="Recept kártya">
	<img class="mini-recipe-img" [src]="slot.recipeImageUrl" [alt]="slot.recipeTitle + ' - étel fotó'" loading="lazy">
	<div class="mini-recipe-info">
		<div class="mini-recipe-title">{{ slot.recipeTitle }}</div>
		<div class="mini-recipe-meta">{{ slot.recipePrepTime }} perc • {{ slot.recipeCalories }} kcal</div>
	</div>
	<div class="slot-actions">
		<button class="slot-btn" (click)="edit.emit()">Csere</button>
		<button class="slot-btn" (click)="delete.emit()">Törlés</button>
	</div>
</div>
