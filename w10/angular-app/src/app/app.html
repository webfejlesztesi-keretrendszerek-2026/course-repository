<nav class="main-navbar">
  <div class="brand">
    <img src="/assets/images/heti_menu_logo.png" alt="ReceptApp" class="brand-logo" width="40" height="40" loading="eager" />
  </div>
  <input #menuToggle type="checkbox" id="menu-toggle" class="menu-toggle" hidden>
  <label for="menu-toggle" class="menu-icon" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </label>
  <div class="menu-links">
    <a routerLink="/recipes" routerLinkActive="active" (click)="closeMenu()">
      <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h6v6h-6z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="label">Recept katalógus</span>
    </a>
    <ng-container *ngIf="authService.isLoggedIn(); else loggedOutLinks">
      <a routerLink="/menu" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="18" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg></span>
        <span class="label">Heti menü</span>
      </a>
      <a routerLink="/shopping" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="20" r="1" fill="currentColor"/><circle cx="18" cy="20" r="1" fill="currentColor"/></svg></span>
        <span class="label">Bevásárlólista</span>
      </a>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
        <span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/></svg></span>
        <span class="label">Profil</span>
      </a>
      <button class="nav-logout" (click)="handleLogout(); closeMenu()">Kijelentkezés</button>
    </ng-container>
    <ng-template #loggedOutLinks>
      <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">
        <span class="label">Bejelentkezés</span>
      </a>
    </ng-template>
  </div>
</nav>

<app-toast></app-toast>

<router-outlet></router-outlet>

<!-- Test helpers: indicate auth-ready state and expose dashboard selector for Cypress -->
<div *ngIf="authService.isLoggedIn()" data-cy="auth-ready" style="display:none"></div>

    <span class="label">Recept</span>

  <ng-container *ngIf="authService.isLoggedIn(); else guestTabs">
    <a routerLink="/menu" routerLinkActive="active" (click)="closeMenu()">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="14" width="18" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg></span>
      <span class="label">Menü</span>
    </a>
    <a routerLink="/shopping" routerLinkActive="active" (click)="closeMenu()">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="20" r="1" fill="currentColor"/><circle cx="18" cy="20" r="1" fill="currentColor"/></svg></span>
      <span class="label">Lista</span>

    <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/></svg></span>
      <span class="label">Profil</span>
    </a>
  </ng-container>
  <ng-template #guestTabs>
    <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">
      <span class="label">Bejelentkezés</span>
    </a>
  </ng-template>
</nav>
