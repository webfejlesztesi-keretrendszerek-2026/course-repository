<a class="skip-link" href="#main-content">Ugrás a tartalomra</a>

<main id="main-content">
	<header>
		<h1>Bejelentkezés</h1>
	</header>

	<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" aria-label="Bejelentkezés" novalidate>

		<div class="form-error" *ngIf="error()" aria-live="assertive">{{ error() }}</div>

		<div class="form-group">
			<label for="email">Email</label>
			<input id="email" type="email" formControlName="email" [attr.aria-describedby]="email?.invalid && (email?.dirty || email?.touched) ? 'email-error' : null" />
			<small id="email-error" *ngIf="email?.invalid && (email?.dirty || email?.touched)">
				<span *ngIf="email?.errors?.['required']">Kötelező mező</span>
				<span *ngIf="email?.errors?.['email']">Kérlek érvényes email címet adj meg</span>
			</small>
		</div>

		<div class="form-group">
			<label for="password">Jelszó</label>
			<input id="password" type="password" formControlName="password" [attr.aria-describedby]="password?.invalid && (password?.dirty || password?.touched) ? 'password-error' : null" />
			<small id="password-error" *ngIf="password?.invalid && (password?.dirty || password?.touched)">
				<span *ngIf="password?.errors?.['required']">Kötelező mező</span>
				<span *ngIf="password?.errors?.['minlength']">Legalább 8 karakter szükséges</span>
			</small>
		</div>

		<button type="submit" class="login-btn" [disabled]="form.invalid || loading()">
			<span *ngIf="!loading()">Bejelentkezés</span>
			<span *ngIf="loading()">Bejelentkezés...</span>
		</button>

		<p class="register-link">Nincs még fiókod? <a routerLink="/register">Regisztrálj!</a></p>
	</form>
</main>

<footer>
	<small>&copy; 2026 Heti Menü</small>
</footer>
